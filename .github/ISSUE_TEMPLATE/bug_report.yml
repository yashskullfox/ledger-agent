name: Bug Report
description: Report a bug or unexpected behaviour
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Privacy reminder**: Do not include real entity names, partner names,
        account numbers, institution names, or financial figures. Use the
        pseudonyms from `config/redaction_corpus.yaml`.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: What happened? What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Run `ledger balance 2024`
        2. Observe error ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true
  - type: input
    id: python-version
    attributes:
      label: Python version
      placeholder: "e.g. 3.11.9"
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Paste redacted output only — no real names or figures
      render: shell
